<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test</title>
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<!-- <script>console.log = function () {};</script> -->
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
			overflow: hidden;
		}

		body.allow-scroll {
			overflow: hidden;
		}
		.navbar {
			position: fixed;
			top: 0%;
			left: 0;
			width: 100%;
			background-color: #000000;
			padding: 10px 0;
			display: flex;
			justify-content: center;
			z-index: 3;
		}

		.navbar button {
			background-color: #180247;
			border: none;
			color: white;
			padding: 10px 20px;
			margin: 0 10px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.navbar button:hover {
			background-color: #6f45a0;
		}

		#renderCanvas {
			width: 100%;
			height: 100%;
			display: block;
			touch-action: none;
		}

		#app {
		transition: opacity 0.5s ease-in-out;
		}

		.fade-out {
			opacity: 0;
		}

		.fade-in {
			opacity: 1;
		}

		 /* Cookie Popup */
		 .persistent-popup {
			position: fixed;
			bottom: 20px;
			right: 20px;
			width: 350px;
			max-width: 90vw;
			background: white;
			border-radius: 12px;
			padding: 20px;
			box-shadow: 
				0 4px 30px rgba(0, 0, 0, 0.3),
				0 0 20px rgba(255, 255, 255, 0.1);
			z-index: 10000;
			border: 2px solid #ddd;
			display: none;
		}

		.persistent-popup.active {
			display: block;
		}

		.popup-content {
			position: relative;
		}

		.popup-title {
			font-size: 18px;
			font-weight: bold;
			margin-bottom: 10px;
			color: #333;
		}

		.popup-text {
			font-size: 14px;
			color: #666;
			margin-bottom: 15px;
			line-height: 1.4;
		}

		.popup-buttons {
			display: flex;
			gap: 10px;
			justify-content: flex-end;
		}

		.popup-btn {
			padding: 8px 16px;
			border: none;
			border-radius: 6px;
			font-size: 14px;
			cursor: pointer;
			transition: background-color 0.3s;
		}

		.popup-btn.necessary {
			background-color: #f0f0f0;
			color: #333;
			border: 1px solid #ddd;
		}

		.popup-btn.necessary:hover {
			background-color: #e0e0e0;
		}

		.popup-btn.allow-all {
			background-color: #180247;
			color: white;
		}

		.popup-btn.allow-all:hover {
			background-color: #6f45a0;
		}

		/* Responsive */
		@media (max-width: 480px) {
			.persistent-popup {
				bottom: 10px;
				right: 10px;
				left: 10px;
				width: auto;
			}
			
			.popup-buttons {
				flex-direction: column;
			}
		}
	</style>
</head>

<body>
	<div id="notification-container" style="display: none;">
		<p id="resultMessage"></p>
	</div>
	<canvas id="renderCanvas" style="width: 100%; height: 100vh;"></canvas>
	<!-- Cookie Popup -->
	<div id="persistent-popup" class="persistent-popup">
		<div class="popup-content">
			<div class="popup-title">🍪 Cookie Settings</div>
			<div class="popup-text">
				We use cookies to enhance your experience on our website. You can choose to accept only necessary cookies or allow all cookies for a better experience.
			</div>
			<div class="popup-buttons">
				<button id="necessary-btn" class="popup-btn necessary">Necessary</button>
				<button id="allow-all-btn" class="popup-btn allow-all">Allow All</button>
			</div>
		</div>
	</div>
	
	<script type="module" src="/static/js/index.js"></script>
	 
	<div id="app" class="fade-in">
	<script src="https://cdn.babylonjs.com/babylon.js"></script>
	<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
	<script src="https://preview.babylonjs.com/gui/babylon.gui.min.js"></script>
	<script type="module" src="srcs/game/gameplay/babylon.js"></script>

	<!-- <script src="./utils/logger.js"></script> -->
	<script type="module" src="./api/utils.js"></script>
	<script type="module" src="./api/websocket.js"></script>
	<script type="module" src="./api/auth.js"></script>
	<script type="module" src="./api/userManagement.js"></script>
	<script type="module" src="./api/friendships.js"></script>
	<script type="module" src="./api/games.js"></script>

</body>

</html>
