<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test</title>
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<!-- <script>console.log = function () {};</script> -->
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
			overflow: hidden;
		}

		body.allow-scroll {
			overflow: hidden;
		}
		.navbar {
			position: fixed;
			top: 0%;
			left: 0;
			width: 100%;
			background-color: #000000;
			padding: 10px 0;
			display: flex;
			justify-content: center;
			z-index: 3;
		}

		.navbar button {
			background-color: #180247;
			border: none;
			color: white;
			padding: 10px 20px;
			margin: 0 10px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.navbar button:hover {
			background-color: #6f45a0;
		}

		#renderCanvas {
			width: 100%;
			height: 100%;
			display: block;
			touch-action: none;
		}

		#app {
		transition: opacity 0.5s ease-in-out;
		}

		.fade-out {
			opacity: 0;
		}

		.fade-in {
			opacity: 1;
		}
	</style>
</head>

<body>
	<div id="notification-container" style="display: none;">
		<p id="resultMessage"></p>
	</div>
	<canvas id="renderCanvas" style="width: 100%; height: 100vh;"></canvas>
	
	<script type="module" src="/static/js/index.js"></script>
	 
	<div id="app" class="fade-in">
	<script src="https://cdn.babylonjs.com/babylon.js"></script>
	<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
	<script src="https://preview.babylonjs.com/gui/babylon.gui.min.js"></script>
	<script type="module" src="srcs/game/gameplay/babylon.js"></script>

	<!-- <script src="./utils/logger.js"></script> -->
	<script type="module" src="./api/utils.js"></script>
	<script type="module" src="./api/websocket.js"></script>
	<script type="module" src="./api/auth.js"></script>
	<script type="module" src="./api/userManagement.js"></script>
	<script type="module" src="./api/friendships.js"></script>
	<script type="module" src="./api/games.js"></script>

</body>

</html>
