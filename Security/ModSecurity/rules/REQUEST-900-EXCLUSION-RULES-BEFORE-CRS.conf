# ------------------------------------------------------------------------
# OWASP CRS ver.4.15.0-dev
# Local exclusions for Transcendance application
# ------------------------------------------------------------------------

#
# Exclusion for IP addresses in Host header for all application routes
# This allows users to access the application using IP addresses
# without being blocked by rule 920350
#
SecRule REQUEST_URI "@beginsWith /request/" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920350"

#
# Additional exclusion for file upload size limits (rule 413)
# Allow larger file uploads for profile pictures
#
SecRule REQUEST_URI "@beginsWith /request/user/update-profile-picture" \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=200002"